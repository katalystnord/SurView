name: check

# The half that survives a fresh clone and `git commit --no-verify`.
#
# tools/git-hooks/pre-commit is the fast local gate, but a hook lives in one
# person's working copy, is opt-in per clone, and can be skipped with a flag.
# This job cannot be skipped, and it is the only instrument here that sees the
# project the way a new contributor's machine does -- from nothing, with no
# build directory and no state.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push makes an older run irrelevant; nobody reads two answers.
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  # ⚑ Without these, `apt-get install -y` still stops for a debconf question or
  # a needrestart service prompt and waits forever. The first run of this
  # workflow sat on "Install dependencies" for 28 minutes and had to be killed:
  # a wrong package name fails in seconds, so a hang is always a prompt.
  DEBIAN_FRONTEND: noninteractive
  NEEDRESTART_MODE: a

jobs:
  surview:
    name: SurView build + tests
    # ⚑ NOT ubuntu-latest. On 24.04 the distro's `libvtk9-qt-dev` is built
    # against Qt5, while SurView is a Qt6 application -- so the packages install
    # cleanly and then find_package(VTK COMPONENTS GUISupportQt) hands back a
    # Qt5 binding that cannot be combined with Qt6::Widgets. The failure is at
    # configure time and says nothing about Qt, which is why it took a run to
    # find. 26.04 is the first image whose VTK is a Qt6 build.
    runs-on: ubuntu-26.04
    steps:
      - name: Check out SurView
        uses: actions/checkout@v4
        with:
          path: SurView

      - name: No em-dashes
        # The half that survives a fresh clone and --no-verify. Cheap enough to
        # run before anything is installed, so a style-only mistake fails in
        # seconds rather than after a full build.
        run: SurView/tools/check-no-em-dashes.sh

      - name: Read the engine pin
        id: pin
        # The pin is the single source of truth for which engine commit this
        # build is verified against. CI resolves it the same way CMake does,
        # rather than tracking a branch -- a CI that silently followed
        # surview-dev would stop testing what the repository actually claims.
        run: |
          . SurView/cmake/opencorr.pin
          echo "sha=$SURVIEW_OPENCORR_PIN" >> "$GITHUB_OUTPUT"
          echo "remote=$SURVIEW_OPENCORR_REMOTE" >> "$GITHUB_OUTPUT"
          echo "Engine pin: $SURVIEW_OPENCORR_PIN ($SURVIEW_OPENCORR_PIN_NOTE)"

      - name: Check out the pinned engine
        run: |
          git clone --filter=blob:none "${{ steps.pin.outputs.remote }}" OpenCorr
          git -C OpenCorr checkout --detach "${{ steps.pin.outputs.sha }}"
          echo "Engine at $(git -C OpenCorr rev-parse --short HEAD)"

      # ⚑ THE DEPENDENCY DOWNLOAD IS THE SLOWEST THING IN THIS WORKFLOW, and it
      # cannot be made smaller. libvtkN-qt-dev pulls the entire VTK stack as
      # hard Depends -- python3-vtk9, python3-mpi4py, the Qt5 libraries, the
      # Wayland integration -- so --no-install-recommends, which is already set,
      # has nothing left to trim. Two runs on 2026-08-19 spent 25 and 33 minutes
      # here and one of them hit its own timeout while still downloading.
      #
      # So it is cached instead of shrunk. The key covers this file, because
      # this file is where the package list lives: change the list and the cache
      # is correctly missed.
      - name: Cache the dependency downloads
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-surview-ubuntu-26.04-${{ hashFiles('.github/workflows/check.yml') }}

      - name: Install dependencies
        timeout-minutes: 25
        run: |
          # Downloads land in the cached directory rather than apt's own, and
          # Keep-Downloaded-Packages stops apt deleting them the moment they are
          # unpacked -- without it the cache would save an empty folder.
          mkdir -p "$HOME/apt-archives/partial"
          apt_cached=(-o Acquire::Retries=3
                      -o Dir::Cache::archives="$HOME/apt-archives"
                      -o APT::Keep-Downloaded-Packages=true)
          # Acquire::Retries because the runner's default mirror
          # (azure.archive.ubuntu.com) is not always reachable: a run on
          # 2026-08-18 failed with every line of `apt-get update` ignored,
          # fell back to archive.ubuntu.com, and then hit the step timeout.
          # That is an outage, not a broken build, and it should not read as one.
          sudo apt-get -o Acquire::Retries=3 update
          # VTK's Qt binding package carries its ABI version in the name, and
          # that version moves with the runner image. Discovered rather than
          # written down: a hard-coded name is a build that breaks on somebody
          # else's schedule, and the first two attempts here were both guesses.
          vtk_qt=$(apt-cache search --names-only '^libvtk[0-9.]+-qt-dev$' \
                   | awk '{print $1}' | sort -V | tail -1)
          # Guard the toolkit, not just the name: a VTK Qt binding built against
          # Qt5 installs perfectly and fails much later, in a message about
          # neither Qt nor VTK.
          #
          # ⚑ DIRECT depends only, deliberately. Qt5 libraries DO appear in the
          # full install closure on this image and that is not the fault this
          # guard is looking for: a run on 2026-08-19 installed libqt5widgets5t64
          # alongside libqt6widgets6 and built, configured and tested green
          # against Qt6. Widening this to the resolved closure would fail every
          # run for a reason that has never broken anything.
          if apt-cache depends "$vtk_qt" | grep -q 'libqt5'; then
            echo "$vtk_qt on this image is a Qt5 build; SurView is Qt6." >&2
            echo "Use a runner image whose VTK is built against Qt6." >&2
            exit 1
          fi
          if [ -z "$vtk_qt" ]; then
            echo "No libvtkN-qt-dev package on this image. Candidates were:"
            apt-cache search --names-only '^libvtk' || true
            exit 1
          fi
          echo "Using VTK Qt package: $vtk_qt"
          sudo apt-get "${apt_cached[@]}" install -y --no-install-recommends \
            ninja-build cmake g++ \
            qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev \
            "$vtk_qt" \
            libopencv-dev libeigen3-dev libfftw3-dev libnanoflann-dev \
            libomp-dev xvfb
          # apt writes as root; the cache is saved as the runner user.
          sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-archives"

      - name: Configure
        run: cmake -S SurView -B SurView/build-ninja -G Ninja

      - name: Build
        run: cmake --build SurView/build-ninja

      - name: Test
        # The walkthrough tests bring their own X server (xvfb-run, wired in
        # tests/CMakeLists.txt), so nothing extra is needed here -- and a runner
        # with no display is exactly the environment that proves it.
        run: ctest --test-dir SurView/build-ninja --output-on-failure

  engine:
    name: Engine (pinned fork) smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out SurView
        uses: actions/checkout@v4
        with:
          path: SurView

      - name: Read the engine pin
        id: pin
        run: |
          . SurView/cmake/opencorr.pin
          echo "sha=$SURVIEW_OPENCORR_PIN" >> "$GITHUB_OUTPUT"
          echo "remote=$SURVIEW_OPENCORR_REMOTE" >> "$GITHUB_OUTPUT"

      - name: Check out the pinned engine
        run: |
          git clone --filter=blob:none "${{ steps.pin.outputs.remote }}" OpenCorr
          git -C OpenCorr checkout --detach "${{ steps.pin.outputs.sha }}"

      - name: Cache the dependency downloads
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-engine-ubuntu-latest-${{ hashFiles('.github/workflows/check.yml') }}

      # ⚑ Identical treatment to the SurView job above, and identical timeout.
      # These two drifted once already: the hardening added on 2026-08-18 went
      # into one job and not the other, and this one then died on an
      # unretried `apt-get update` while its twin survived the same outage.
      # Anything changed in one belongs in the other.
      - name: Install dependencies
        timeout-minutes: 25
        run: |
          mkdir -p "$HOME/apt-archives/partial"
          apt_cached=(-o Acquire::Retries=3
                      -o Dir::Cache::archives="$HOME/apt-archives"
                      -o APT::Keep-Downloaded-Packages=true)
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get "${apt_cached[@]}" install -y --no-install-recommends \
            ninja-build cmake g++ \
            libopencv-dev libeigen3-dev libfftw3-dev libnanoflann-dev libomp-dev
          sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-archives"

      - name: Build the engine's smoke tests
        run: |
          cmake -S OpenCorr -B OpenCorr/build -G Ninja -DOPENCORR_BUILD_SMOKE_TEST=ON
          cmake --build OpenCorr/build

      - name: Run the engine's smoke tests
        # A green SurView suite against a broken engine is a green suite that
        # tells you nothing: the engine is where the measurement happens.
        run: ctest --test-dir OpenCorr/build --output-on-failure
